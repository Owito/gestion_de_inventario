<h1 mat-dialog-title>{{ isEditMode ? 'Editar Producto' : 'Agregar Producto' }}</h1>
<div mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="Nombre">
    <mat-error *ngIf="form.get('Nombre')?.hasError('required')">El nombre es requerido.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Descripción</mat-label>
    <textarea matInput formControlName="Descripcion"></textarea>
    <mat-error *ngIf="form.get('Descripcion')?.hasError('required')">La descripción es requerida.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Precio Unitario</mat-label>
    <input matInput formControlName="PrecioUnitario" type="number" min="0">
    <mat-error *ngIf="form.get('PrecioUnitario')?.hasError('required')">El precio es requerido.</mat-error>
    <mat-error *ngIf="form.get('PrecioUnitario')?.hasError('min')">El precio no puede ser negativo.</mat-error>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!form.valid">{{ isEditMode ? 'Guardar Cambios' : 'Crear' }}</button>
</div>
