<h1 mat-dialog-title>{{ isEditMode ? 'Editar Despacho' : 'Registrar Despacho' }}</h1>
<div mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Fecha de Despacho</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="Fecha">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="form.get('Fecha')?.hasError('required')">La fecha es requerida.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Proveedor</mat-label>
    <mat-select formControlName="ID_Proveedor">
      <mat-option *ngFor="let proveedor of proveedores$ | async" [value]="proveedor.ID">
        {{ proveedor.Nombre }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('ID_Proveedor')?.hasError('required')">El proveedor es requerido.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Producto</mat-label>
    <mat-select formControlName="ID_Producto">
      <mat-option *ngFor="let producto of productos$ | async" [value]="producto.ID">
        {{ producto.Nombre }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('ID_Producto')?.hasError('required')">El producto es requerido.</mat-error>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!form.valid">{{ isEditMode ? 'Guardar Cambios' : 'Crear' }}</button>
</div>
